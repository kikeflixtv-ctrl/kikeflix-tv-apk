name: Compilar APK KikeFlix TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias de Capacitor
        run: npm install

      - name: Generar proyecto Android
        run: npx cap add android

      - name: Aplicar configuracion Android TV y TV Box
        run: node scripts/patch-android.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: KikeFlix-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
